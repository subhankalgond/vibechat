name: Keep API awake

on:
  schedule:
    # Every 10 minutes, keeps the free Render instance from sleeping.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 https://vibechat-uukh.onrender.com/api/health || true)
          echo "Health check returned: $code"
